name: Deploy Website

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Render templates
        run: |
          npm install handlebars
          mkdir -p output

          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const Handlebars = require("handlebars");

          function render(templatePath, contextPath, outputPath) {
            const template = Handlebars.compile(
              fs.readFileSync(templatePath, "utf8"),
              { noEscape: true }
            );
            const context = JSON.parse(fs.readFileSync(contextPath, "utf8"));
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });
            fs.writeFileSync(outputPath, template(context));
            console.log(`Rendered: ${contextPath} + ${templatePath} → ${outputPath}`);
          }

          // Render index.html and radio.js from the main stream data
          render("./templates/html.hbs", "./streams/radio.json", "output/index.html");
          render("./templates/script.hbs", "./streams/radio.json", "output/radio.js");

          // Render an .m3u8 file for each JSON file in ./streams/
          const streamFiles = fs.readdirSync("./streams")
            .filter(f => f.endsWith(".json"));

          for (const file of streamFiles) {
            const basename = path.basename(file, ".json");
            render(
              "./templates/m3u8.hbs",
              path.join("./streams", file),
              path.join("output", `${basename}.m3u8`)
            );
          }
          EOF

      - name: Deploy files
        run: |
             cp -R -v ./*.ico ./*.png ./app.css ./assets ./logos ./site.webmanifest ./output

      - uses: actions/configure-pages@v5
        name: Setup Pages

      - uses: actions/upload-pages-artifact@v3
        name: Upload artifact
        with:
          # Upload entire repository
          path: output/

      - uses: actions/deploy-pages@v4
        name: Deploy to GitHub Pages
        id: deployment
